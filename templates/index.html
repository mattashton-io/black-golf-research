<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Golf Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bgr-teal: #099268;
            --bgr-teal-dark: #087f5b;
            --bgr-dark: #212529;
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #212529;
            --border-color: #dee2e6;
        }

        body.dark {
            --bg-body: #1a1b1e;
            --bg-card: #25262b;
            --text-main: #ced4da;
            --border-color: #373a40;
            --bgr-dark: #101113;
        }

        .bgr-teal-bg { background-color: var(--bgr-teal); }
        .bgr-dark-bg { background-color: var(--bgr-dark); }
        .bgr-teal-text { color: var(--bgr-teal); }
        .bgr-teal-border { border-color: var(--bgr-teal); }
        
        body { background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .bg-card { background-color: var(--bg-card); border-color: var(--border-color); }
    </style>
</head>
<body class="font-sans">
    <!-- Header -->
    <header class="bgr-dark-bg text-white p-6 shadow-lg border-b-4 bgr-teal-border">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold tracking-tight">BLACK GOLF <span class="bgr-teal-text">RESEARCH</span></h1>
            <div class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-700 transition" title="Toggle Dark Mode">
                    <svg id="darkIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z">
                        </path>
                    </svg>
                    <svg id="lightIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
                <div class="flex flex-col text-left">
                    <label class="text-[10px] uppercase font-bold text-gray-400 mb-1">Search Settings</label>
                    <div class="flex items-center space-x-2">
                        <input type="text" id="zipCode" placeholder="Zip"
                            class="w-20 p-2 rounded text-black border-2 border-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <select id="radiusSel" class="p-2 rounded text-black border-2 border-white focus:outline-none">
                            <option value="10">10 mi</option>
                            <option value="15">15 mi</option>
                            <option value="20">20 mi</option>
                            <option value="25">25 mi</option>
                        </select>
                        <select id="filterSel" class="p-2 rounded text-black border-2 border-white focus:outline-none">
                            <option value="strict">Strict Majority (>50%)</option>
                            <option value="plurality">Plurality</option>
                            <option value="holc">Historical (HOLC)</option>
                        </select>
                        <label class="flex items-center text-xs space-x-1 cursor-pointer">
                            <input type="checkbox" id="autoExpand" checked
                                class="w-4 h-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                            <span>Auto-Expand</span>
                        </label>
                        <button onclick="performSearch()" id="searchBtn"
                            class="bgr-teal-bg hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition duration-200">
                            SEARCH
                        </button>
                    </div>
                    </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-6 text-center">
        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- Map Container -->
            <div class="bg-card p-4 rounded-lg shadow-md border-t-4 bgr-teal-border h-[500px]">
                <h2 class="text-xl font-bold mb-4 bgr-dark-bg text-white p-2 rounded">Course Geographic Distribution</h2>
                <div id="map" class="w-full h-[400px] rounded border border-gray-300"></div>
            </div>

            <!-- Plots Carousel Area -->
            <div class="bg-card p-4 rounded-lg shadow-md border-t-4 bgr-teal-border">
                <h2 class="text-xl font-bold mb-4 bgr-dark-bg text-white p-2 rounded">Demographic Insights</h2>
                <div id="plotsContainer" class="flex flex-col space-y-4 overflow-y-auto max-h-[420px]">
                    <p class="text-gray-500 italic">Enter a zip code to see analysis plots.</p>
                </div>
            </div>
        </div>

        <!-- Course List -->
        <div class="bg-card p-6 rounded-lg shadow-md border-l-8 bgr-teal-border text-left">
            <h2 class="text-2xl font-bold mb-4 bgr-dark-bg text-white p-2 rounded inline-block">Discovered Courses</h2>
            <div id="courseList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-500">Nearby courses will appear here.</p>
            </div>
        </div>
<!-- Details Modal -->
<div id="detailsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
    <div class="bg-card w-full max-w-2xl rounded-lg shadow-2xl overflow-hidden border-2 bgr-teal-border">
        <div class="bgr-dark-bg p-4 text-white flex justify-between items-center">
            <h2 id="modalName" class="text-xl font-bold">Course Details</h2>
            <button onclick="closeModal()" class="text-2xl hover:text-gray-300">&times;</button>
        </div>
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 max-h-[80vh] overflow-y-auto">
            <div>
                <div class="mb-4">
                    <label class="text-[10px] uppercase font-bold text-gray-400">Address</label>
                    <p id="modalAddress" class="text-sm italic">N/A</p>
                </div>
                <div class="mb-4">
                    <label class="text-[10px] uppercase font-bold text-gray-400">Phone</label>
                    <p id="modalPhone" class="text-sm">N/A</p>
                </div>
                <div class="mb-4">
                    <label class="text-[10px] uppercase font-bold text-gray-400">Website</label>
                    <a id="modalWebsite" href="#" target="_blank"
                        class="text-sm bgr-teal-text hover:underline block truncate">N/A</a>
                </div>
                <div class="mt-6 p-4 rounded bg-gray-50 dark:bg-gray-800 border bgr-teal-border">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold">Current Weather</span>
                        <span id="modalWeather" class="text-xl font-bold bgr-teal-text">Loading...</span>
                    </div>
                    <p class="text-[10px] text-gray-500 mt-1">Source: WeatherNext BigQuery</p>
                </div>
            </div>
            <div>
                <h4 class="text-center font-bold mb-4">Neighborhood Demographics</h4>
                <div class="relative h-64">
                    <canvas id="demographicChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
    </main>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&libraries=geometry"></script>
    <script>
        let map;
        let markers = [];
            let currentCourses = {};
            let demographicChart = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 38.9383, lng: -76.8202 }, // Default to DC
                zoom: 10,
                styles: [
                    { "featureType": "all", "elementType": "labels.text.fill", "stylers": [{ "color": "#000000" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#c8d7d4" }] }
                ]
            });
        }

        async function performSearch() {
            const zip = document.getElementById("zipCode").value;
            const radius = document.getElementById("radiusSel").value;
            const filter = document.getElementById("filterSel").value;
            const autoExpand = document.getElementById("autoExpand").checked;

            if (!zip) return alert("Please enter a zip code");

            const btn = document.getElementById("searchBtn");
            btn.innerHTML = "SEARCHING...";
            btn.disabled = true;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        zip_code: zip,
                        radius: parseInt(radius),
                        filter_mode: filter,
                        target_black_majority: autoExpand
                    })
                });
                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                } else {
                    currentCourses = {};
                    data.courses.forEach(c => currentCourses[c.place_id] = c);
                    updateUI(data);
                }
            } catch (e) {
                console.error(e);
                alert("Search failed.");
            } finally {
                btn.innerHTML = "SEARCH";
                btn.disabled = false;
            }
        }

        function updateUI(data) {
            // Update Map
            const center = { lat: data.lat, lng: data.lng };
            map.setCenter(center);
            map.setZoom(11);

            // Clear existing markers
            markers.forEach(m => m.setMap(null));
            markers = [];

            // Add Origin Marker
            new google.maps.Marker({
                position: center,
                map: map,
                icon: 'http://maps.google.com/mapfiles/ms/icons/red-pushpin.png'
            });

            // Add Course Markers
            data.courses.forEach(course => {
                const marker = new google.maps.Marker({
                    position: { 
                        lat: course.geometry.location.lat, 
                        lng: course.geometry.location.lng 
                    },
                    map: map,
                    title: course.name
                });
                markers.push(marker);
            });

            // Update Plots
            const plotsContainer = document.getElementById("plotsContainer");
            plotsContainer.innerHTML = "";
            data.plots.forEach(plot => {
                const img = document.createElement("img");
                img.src = `/search_plot/${plot}?t=${new Date().getTime()}`;
                img.className = "w-full rounded shadow border bgr-teal-border";
                plotsContainer.appendChild(img);
            });

            // Update Course List
            const list = document.getElementById("courseList");
            list.innerHTML = "";
            data.courses.forEach(course => {
                const div = document.createElement("div");
                div.className = "p-4 border-l-4 bgr-teal-border bg-card rounded shadow-sm hover:translate-x-1 transition-transform flex flex-col justify-between";
                div.innerHTML = `
                    <div>
                        <h3 class="font-bold bgr-teal-text text-left">${course.name}</h3>
                        <p class="text-sm text-gray-500 text-left line-clamp-2">${course.formatted_address || course.vicinity || ''}</p>
                    </div>
                    <div class="mt-4 flex flex-col gap-2">
                        <div class="flex justify-between items-center text-xs font-semibold">
                            <span>${course.pct_black || 0}% Black Pop</span>
                            <span class="bg-card text-main border border-gray-500 px-2 py-0.5 rounded">Pop: ${course.total_pop || 0}</span>
                        </div>
                        <button onclick="showCourseDetails('${course.place_id}')" class="w-full py-1 text-xs font-bold uppercase border bgr-teal-border bgr-teal-text hover:bg-teal-500 hover:text-white transition">
                            View Details
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

            function closeModal() {
                document.getElementById("detailsModal").classList.add("hidden");
            }

            async function showCourseDetails(placeId) {
                const course = currentCourses[placeId];
                if (!course) return;

                document.getElementById("modalName").innerText = course.name;
                document.getElementById("modalAddress").innerText = course.formatted_address || course.vicinity || 'N/A';
                document.getElementById("modalPhone").innerText = course.formatted_phone_number || 'N/A';

                const website = document.getElementById("modalWebsite");
                if (course.website) {
                    website.href = course.website;
                    website.innerText = course.website;
                    website.classList.remove("hidden");
                } else {
                    website.innerText = "N/A";
                }

                document.getElementById("modalWeather").innerText = "Loading...";
                document.getElementById("detailsModal").classList.remove("hidden");

                // Fetch Weather
                try {
                    const wRes = await fetch('/get_weather', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            lat: course.geometry.location.lat,
                            lng: course.geometry.location.lng
                        })
                    });
                    const wData = await wRes.json();
                    document.getElementById("modalWeather").innerText = wData.temperature !== null ? `${wData.temperature}°F` : 'N/A';
                } catch (e) {
                    document.getElementById("modalWeather").innerText = "Error";
                }

                // Update Chart
                updateDemographicChart(course);
            }

            function updateDemographicChart(course) {
                console.log("Updating demographic chart for course:", course.name);
                const ctx = document.getElementById('demographicChart').getContext('2d');

                if (demographicChart) {
                    demographicChart.destroy();
                }

                // Check for data presence
                const demoData = [
                    course.pct_black || 0,
                    course.pct_white || 0,
                    course.pct_hispanic || 0,
                    course.pct_asian || 0,
                    course.pct_native || 0,
                    course.pct_pacific || 0
                ];

                const hasData = demoData.some(val => val > 0);
                if (!hasData) {
                    console.warn("No demographic data available for this course.");
                    // Draw placeholder text or leave empty
                    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                    ctx.textAlign = 'center';
                    ctx.fillText('No demographic data found in cache.', ctx.canvas.width / 2, ctx.canvas.height / 2);
                    return;
                }

                const data = {
                    labels: ['Black', 'White', 'Hispanic', 'Asian', 'Native', 'Pacific'],
                    datasets: [{
                        data: demoData,
                        backgroundColor: [
                            '#099268', // Teal
                            '#339af0', // Blue
                            '#fab005', // Yellow
                            '#be4bdb', // Grape
                            '#fa5252', // Red
                            '#15aabf'  // Cyan
                        ]
                    }]
                };

                demographicChart = new Chart(ctx, {
                    type: 'pie',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    boxWidth: 12,
                                    font: { size: 10 }
                                }
                            }
                        }
                    }
                });
            }

                    function toggleDarkMode() {
                        document.body.classList.toggle('dark');
                        const isDark = document.body.classList.contains('dark');
                        document.getElementById('lightIcon').classList.toggle('hidden', isDark);
                        document.getElementById('darkIcon').classList.toggle('hidden', !isDark);

                        // Re-init map styles if needed for dark mode
                        if (map) {
                            const darkStyle = [
                                { "elementType": "geometry", "stylers": [{ "color": "#242f3e" }] },
                                { "elementType": "labels.text.stroke", "stylers": [{ "color": "#242f3e" }] },
                                { "elementType": "labels.text.fill", "stylers": [{ "color": "#746855" }] },
                                { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#17263c" }] }
                            ];
                            const lightStyle = [
                                { "featureType": "all", "elementType": "labels.text.fill", "stylers": [{ "color": "#000000" }] },
                                { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#c8d7d4" }] }
                            ];
                            map.setOptions({ styles: isDark ? darkStyle : lightStyle });
                        }
                    }

        window.onload = initMap;
    </script>
</body>
</html>
